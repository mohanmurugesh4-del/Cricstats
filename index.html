<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CricStats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0a0d12; --panel:#11171f; --panel-2:#171f29; --line:#263243; --line-2:#1b2431;
  --chalk:#eef1f4; --mute:#8794a4; --leather:#e4502f; --amber:#ffb640; --grass:#34c27a; --sky:#6ab7ff;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--chalk);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3{margin:0}
h1{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:40px;line-height:1}
h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:22px;margin-bottom:8px}
a{color:inherit}
code{font-family:var(--f-mono);font-size:13px;background:#070a0e;padding:1px 6px;border-radius:6px}
.muted{color:var(--mute)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,13,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;text-decoration:none;margin-right:auto}
.brand b{color:var(--leather)}
.bar nav{display:flex;gap:16px;font-size:14px}
.bar nav a{text-decoration:none;color:var(--mute)}
.bar nav a:hover{color:var(--chalk)}
#auth-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mute)}
.role.admin{border-color:var(--amber);color:var(--amber)}
.who{font-size:13px;color:var(--mute);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* buttons, tabs, inputs */
.btn{font:600 14px var(--f-body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--chalk);cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s,border-color .2s,filter .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--mute)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--leather);border-color:var(--leather);color:#fff}
.btn.ghost{color:var(--mute)}
.btn.small{padding:6px 12px;font-size:13px}
.tabs{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;background:#0c1218;color:var(--chalk);border:1px solid var(--line);font:500 14px var(--f-body)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select,label textarea{margin-top:6px;color:var(--chalk)}
label.check{display:flex;gap:8px;align-items:center;color:var(--mute)}
label.check input{width:auto;margin:0}
.label{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:14px 0 8px}
.label:first-child{margin-top:0}

/* notices and panels */
.notice{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--mute)}
.notice b{color:var(--chalk)}
.hero-note{padding:60px 0;text-align:left}
.hero-note p{color:var(--mute);max-width:52ch;margin:14px 0 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;min-width:0}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;text-decoration:none;transition:border-color .2s,transform .2s}
a.card:hover{border-color:#3a4a60;transform:translateY(-2px)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);margin-bottom:10px;flex-wrap:wrap}
.live-tag{color:var(--leather);font:600 11px var(--f-mono);letter-spacing:.1em}
.live-tag::before{content:"● "}
.team-row,.score-line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line-2)}
.team-row:last-of-type,.score-line:last-of-type{border-bottom:0}
.team-row b,.score-line b{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--amber);font-variant-numeric:tabular-nums}
.tn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ov{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.status{margin-top:10px;font-size:14px;color:var(--chalk)}
.status.live{color:var(--grass)}
.status.bad{color:#ff8a7a}
.badge{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:2px 8px}
.match .head{margin-bottom:14px}
.match .head .check{margin:12px 0 0}

/* admin scorer */
.scorer{display:grid;grid-template-columns:1fr;gap:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 14px var(--f-mono);min-width:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1218;color:var(--chalk);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.rec{width:100%;margin-top:14px;padding:14px;font:800 22px var(--f-display);text-transform:uppercase;letter-spacing:.05em;background:var(--leather);color:#fff;border:0;border-radius:12px;cursor:pointer}
.rec:disabled{opacity:.4;cursor:not-allowed}
.row3{display:flex;gap:8px;margin-top:10px}
.msg{min-height:20px;font-size:13px;color:var(--mute);margin-top:8px}
.msg.err{color:#ff8a7a}
.msg.ok{color:var(--grass)}

/* commentary, squads, scorecards */
.comm-line{margin:0;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.comm-line .inn{display:inline-block;min-width:26px;font:500 11px var(--f-mono);color:var(--mute);margin-right:8px}
.squads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.squads{grid-template-columns:1fr}}
.name-row{display:block;margin-bottom:8px}
.name-row input{margin:0}
.name-row.ro{padding:8px 12px;border-bottom:1px solid var(--line-2);color:var(--chalk)}
.squads + .btn{margin-top:14px}
.result-big{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:34px;color:var(--chalk);text-align:center}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sc-head h3{margin:0}
.sc-head .tot{font-family:var(--f-display);font-weight:900;font-size:32px;color:var(--amber)}
.tbl{overflow-x:auto}
.sc-t{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.sc-t th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
.sc-t td{padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:right;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.sc-t th:first-child,.sc-t td.nm,.sc-t td.how{text-align:left}
.sc-t td.nm{font-family:var(--f-body);font-weight:600;font-size:14px}
.sc-t td.how{font-family:var(--f-body);color:var(--mute);font-size:13px}
.sc-meta{font-size:13px;color:var(--mute);margin:12px 0 0}
.sc-meta b{color:var(--chalk)}
.sc-sub{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 0}
.sc-list{list-style:none;padding:0;margin:6px 0 0;font-size:13px}
.sc-list li{padding:6px 0;border-bottom:1px solid var(--line-2)}
.sc-list span{color:var(--mute);font-family:var(--f-mono);font-size:12px}

/* new match form */
.form h1{margin-bottom:6px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form .two{grid-template-columns:1fr}}

/* auth dialog */
dialog{background:var(--panel);color:var(--chalk);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
.auth-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.auth-tabs{display:flex;gap:6px;margin-bottom:14px}
.auth-tabs button{flex:1;font:600 14px var(--f-body);padding:9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.auth-tabs button[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.auth-form .btn{width:100%;margin-top:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;transition:transform .3s ease;z-index:20;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast.ok{border-color:var(--grass)}
.toast.err{border-color:#ff8a7a}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#/">CRIC<b>STATS</b></a>
    <nav>
      <a href="#/">Matches</a>
      <a href="#/new" id="new-link" hidden>Start a match</a>
    </nav>
    <div id="auth-area"></div>
  </div>
</header>

<main class="wrap" id="app"><p class="muted">Loading…</p></main>

<div id="toast" class="toast" role="status"></div>

<dialog id="auth-dialog" aria-labelledby="auth-title">
  <div class="auth-head">
    <h2 id="auth-title" style="font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:24px">Account</h2>
    <button class="btn ghost small" id="auth-close" type="button">Close</button>
  </div>
  <div class="auth-tabs">
    <button type="button" data-auth="in" aria-pressed="true">Sign in</button>
    <button type="button" data-auth="up" aria-pressed="false">Register</button>
  </div>

  <form id="signin-form" class="auth-form">
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>

  <form id="signup-form" class="auth-form" hidden>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password (at least 6 characters)<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
    <label>Account type
      <select name="role" id="role-select">
        <option value="viewer">Viewer: watch live scores</option>
        <option value="admin">Admin: score matches and rename players</option>
      </select>
    </label>
    <div id="code-row" hidden>
      <label>Admin invite code<input name="code" autocomplete="off"></label>
    </div>
    <button class="btn primary" type="submit">Create account</button>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" onerror="window.__libFailed=true"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
